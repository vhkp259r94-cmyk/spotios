name: Prueba iPhone (simulador)

# Manual. Arranca un iPhone simulado, reproduce música real y comprueba si sigue sonando en segundo plano.
# code_ref: etiqueta o rama de la que se toma el código de la app (para comparar versiones).
on:
  workflow_dispatch:
    inputs:
      code_ref:
        description: "Etiqueta o rama del código a probar (vacío = la actual)"
        default: ""

jobs:
  sim:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Tomar el código de la app de otra versión
        if: ${{ inputs.code_ref != '' }}
        run: git checkout "${{ inputs.code_ref }}" -- app/src ios/LibreStream
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: node app/build.mjs
      - name: Seleccionar Xcode
        run: |
          X=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] || X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$X"
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: ios
      - name: Prueba de reproducción (simulador)
        working-directory: ios
        shell: bash
        run: |
          SIM=$(xcrun simctl list devices available | grep -m1 -E '^ +iPhone' | grep -oE '[0-9A-F]{8}-[0-9A-F-]{27}')
          xcrun simctl boot "$SIM" || true
          xcodebuild test -project LibreStream.xcodeproj -scheme LibreStream \
            -destination "platform=iOS Simulator,id=$SIM" -only-testing:LibreStreamUITests \
            -resultBundlePath ../result.xcresult CODE_SIGNING_ALLOWED=NO 2>&1 | tee ../test.log | xcpretty || true
          echo "=== RESULTADOS ==="; grep -a "RESULTADO" ../test.log || echo "(sin líneas RESULTADO)"
      - name: Capturas
        if: always()
        run: |
          mkdir -p shots && xcrun xcresulttool export attachments --path result.xcresult --output-path shots 2>&1 | tail -3 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prueba-iphone
          path: |
            shots
            test.log
