name: Build Android APK

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["android/**", "app/**", ".github/workflows/build-android.yml"]
  workflow_dispatch:

permissions:
  contents: write # necesario para adjuntar el .apk a la Release

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Interfaz compartida (tests y empaquetado)
        run: |
          node --test app/test/core.test.mjs
          node app/build.mjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Tests y compilación (APK de depuración, instalable sin Play Store)
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Nombrar el APK
        id: pkg
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || VERSION="dev-${GITHUB_SHA::7}"
          APK="Nsound-${VERSION}-android.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: LibreStream-android
          path: |
            ${{ steps.pkg.outputs.apk }}
            ${{ steps.pkg.outputs.apk }}.sha256

      - name: Adjuntar a GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.pkg.outputs.apk }}
            ${{ steps.pkg.outputs.apk }}.sha256
