name: Prueba en móvil simulado (Android + iPhone)

# Arranca de verdad la app en un emulador de Android y en un simulador de iPhone, la deja funcionando
# y recoge capturas, uso de CPU/memoria y errores. Se lanza a mano (consume bastantes minutos).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node app/build.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compilar APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Activar KVM (emulador rápido)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Emulador Pixel 6 (Android 14): abrir, reproducir y medir
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash android/ci/smoke.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prueba-android
          path: out-android/

  ios:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node app/build.mjs
      - name: Seleccionar Xcode
        run: |
          X=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] || X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$X"; xcodebuild -version
      - run: brew install xcodegen
      - name: Compilar para el simulador
        working-directory: ios
        run: |
          xcodegen generate
          xcodebuild build -project LibreStream.xcodeproj -scheme LibreStream -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO | tail -5
      - name: iPhone simulado: abrir, reproducir y medir
        run: bash ios/ci/smoke.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prueba-ios
          path: out-ios/
