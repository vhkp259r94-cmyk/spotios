name: Build Windows app

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["windows/**", "catalog/**", ".github/workflows/build-windows.yml"]
  workflow_dispatch:

permissions:
  contents: write # necesario para adjuntar el .zip a la Release

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Tests del núcleo
        run: dotnet test windows/LibreStream.Core.Tests -c Release --logger "console;verbosity=normal"

  build:
    needs: test
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publicar (portable, autocontenido)
        run: >
          dotnet publish windows/LibreStream.App -c Release
          -r win-${{ matrix.arch }} -p:Platform=${{ matrix.arch }}
          -o out/Nimbo

      - name: Empaquetar .zip
        id: pkg
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { "dev-$($env:GITHUB_SHA.Substring(0,7))" }
          if (-not (Test-Path out/Nimbo/Nimbo.exe)) { Write-Error "No se generó Nimbo.exe"; exit 1 }
          $zip = "Nimbo-$version-windows-${{ matrix.arch }}.zip"
          Compress-Archive -Path out/Nimbo/* -DestinationPath $zip
          (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() + "  $zip" | Out-File "$zip.sha256" -Encoding ascii
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: LibreStream-windows-${{ matrix.arch }}
          path: |
            ${{ steps.pkg.outputs.zip }}
            ${{ steps.pkg.outputs.zip }}.sha256

      - name: Adjuntar a GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.pkg.outputs.zip }}
            ${{ steps.pkg.outputs.zip }}.sha256
