name: Build unsigned IPA

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["ios/**", "app/**", ".github/workflows/build-ipa.yml"]
  workflow_dispatch:

permissions:
  contents: write # necesario para publicar la Release y actualizar la fuente
  actions: write  # para volver a publicar la web con la fuente nueva

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Interfaz compartida (tests y empaquetado)
        working-directory: .
        run: |
          node --test app/test/core.test.mjs
          node app/build.mjs

      - name: Seleccionar Xcode
        run: |
          X=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$X" ] || X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$X"; xcodebuild -version

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar proyecto
        run: xcodegen generate

      - name: Tests unitarios
        run: |
          SIM=$(xcrun simctl list devices available | grep -m1 -E '^ +iPhone' | grep -oE '[0-9A-F]{8}-[0-9A-F-]{27}')
          test -n "$SIM" || { echo "::error::No hay simulador de iPhone disponible"; exit 1; }
          xcodebuild test \
            -project LibreStream.xcodeproj -scheme LibreStream \
            -destination "platform=iOS Simulator,id=$SIM" \
            CODE_SIGNING_ALLOWED=NO | xcpretty || exit ${PIPESTATUS[0]}
        shell: bash

      - name: Versión de la app
        id: ver
        shell: bash
        run: |
          # v0.8.0-beta.1 → 0.8.0 (número de versión que entiende iOS); la compilación es el nº de ejecución
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            V=$(echo "${GITHUB_REF_NAME#v}" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
            echo "settings=MARKETING_VERSION=$V CURRENT_PROJECT_VERSION=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
            echo "version=$V" >> "$GITHUB_OUTPUT"; echo "build=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          else
            echo "settings=" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilar (Release, sin firmar)
        run: |
          xcodebuild build \
            -project LibreStream.xcodeproj -scheme LibreStream \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" ${{ steps.ver.outputs.settings }} \
            | xcpretty || exit ${PIPESTATUS[0]}
        shell: bash

      - name: Empaquetar .ipa
        id: pkg
        shell: bash
        run: |
          APP="build/Build/Products/Release-iphoneos/LibreStream.app"
          test -d "$APP" || { echo "::error::No se encontró $APP"; exit 1; }
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || VERSION="dev-${GITHUB_SHA::7}"
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          IPA="Nsound-${VERSION}-unsigned.ipa"
          zip -qry "$IPA" Payload
          shasum -a 256 "$IPA" > "$IPA.sha256"
          echo "ipa=ios/$IPA" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: LibreStream-ipa
          path: |
            ${{ steps.pkg.outputs.ipa }}
            ${{ steps.pkg.outputs.ipa }}.sha256

      - name: Publicar en GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}   # v1.2.3-beta.1 → pre-lanzamiento
          files: |
            ${{ steps.pkg.outputs.ipa }}
            ${{ steps.pkg.outputs.ipa }}.sha256
          generate_release_notes: true
          body: |
            IPA **sin firmar**. Instálala con Sideloadly, AltStore o TrollStore (se firma en tu dispositivo).

      - name: Actualizar la fuente de SideStore / AltStore
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true   # si falla (p. ej. rama protegida), la versión ya está publicada
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$GITHUB_WORKSPACE"      # el paso se ejecuta dentro de «ios»: la ruta del IPA es desde la raíz
          IPA="${{ steps.pkg.outputs.ipa }}"
          NAME=$(basename "$IPA")
          SHA=$(cut -d' ' -f1 "$IPA.sha256")
          SIZE=$(stat -f%z "$IPA")
          git fetch origin main
          git checkout -B main origin/main
          python3 tools/make_source.py --tag "$GITHUB_REF_NAME" --version "${{ steps.ver.outputs.version }}" \
            --build "${{ steps.ver.outputs.build }}" --ipa "$NAME" --sha256 "$SHA" --size "$SIZE" \
            --notes "Nsound $GITHUB_REF_NAME"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add site/source.json
          git diff --cached --quiet || git commit -m "web: fuente de SideStore/AltStore para $GITHUB_REF_NAME"
          git push origin HEAD:main
          gh workflow run validate-catalog.yml --ref main
