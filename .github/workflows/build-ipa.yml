name: Build unsigned IPA

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["ios/**", ".github/workflows/build-ipa.yml"]
  workflow_dispatch:

permissions:
  contents: write # necesario para publicar la Release

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Seleccionar Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar proyecto
        run: xcodegen generate

      - name: Tests unitarios
        run: |
          xcodebuild test \
            -project LibreStream.xcodeproj -scheme LibreStream \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            CODE_SIGNING_ALLOWED=NO | xcpretty || exit ${PIPESTATUS[0]}
        shell: bash

      - name: Compilar (Release, sin firmar)
        run: |
          xcodebuild build \
            -project LibreStream.xcodeproj -scheme LibreStream \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | xcpretty || exit ${PIPESTATUS[0]}
        shell: bash

      - name: Empaquetar .ipa
        id: pkg
        shell: bash
        run: |
          APP="build/Build/Products/Release-iphoneos/LibreStream.app"
          test -d "$APP" || { echo "::error::No se encontró $APP"; exit 1; }
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || VERSION="dev-${GITHUB_SHA::7}"
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          IPA="LibreStream-${VERSION}-unsigned.ipa"
          zip -qry "$IPA" Payload
          shasum -a 256 "$IPA" > "$IPA.sha256"
          echo "ipa=ios/$IPA" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: LibreStream-ipa
          path: |
            ${{ steps.pkg.outputs.ipa }}
            ${{ steps.pkg.outputs.ipa }}.sha256

      - name: Publicar en GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.pkg.outputs.ipa }}
            ${{ steps.pkg.outputs.ipa }}.sha256
          generate_release_notes: true
          body: |
            IPA **sin firmar**. Instálala con Sideloadly, AltStore o TrollStore (se firma en tu dispositivo).
