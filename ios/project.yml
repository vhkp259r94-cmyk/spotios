name: LibreStream
options:
  bundleIdPrefix: org.librestream
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.6.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
targets:
  LibreStream:
    type: application
    platform: iOS
    sources:
      - LibreStream
      - path: ../app/dist      # interfaz compartida (se genera con: node app/build.mjs)
        type: folder
        buildPhase: resources
    info:
      path: LibreStream/Resources/Info.plist
      properties:
        CFBundleDisplayName: Nimbo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        LSCatalogURL: https://vhkp259r94-cmyk.github.io/spotios/catalog.json
  LibreStreamTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LibreStreamTests]
    dependencies:
      - target: LibreStream
schemes:
  LibreStream:
    build:
      targets:
        LibreStream: all
    test:
      targets: [LibreStreamTests]
